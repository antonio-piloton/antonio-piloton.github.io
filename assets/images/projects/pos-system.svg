<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052419"/>
      <stop offset="100%" stop-color="#0B4833"/>
    </linearGradient>
    <linearGradient id="goldPos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7C64A"/>
      <stop offset="100%" stop-color="#C59F28"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bgPos)"/>

  <!-- POS Modern Cashier / Touch Register Terminal -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="500" height="270" rx="14" fill="#0E1813" stroke="url(#goldPos)" stroke-width="1.5"/>
    <rect x="0" y="0" width="500" height="34" rx="14" fill="#073B2A"/>
    <rect x="0" y="22" width="500" height="12" fill="#073B2A"/>

    <text x="24" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#E7C64A">SaaS POS &amp; Multi-Branch Inventory Terminal</text>
    <rect x="380" y="8" width="100" height="20" rx="10" fill="#143527"/>
    <text x="430" y="21" font-family="monospace" font-size="7.5" fill="#2ECC71" text-anchor="middle">ONLINE • SYNCED</text>

    <!-- Product Grid Left -->
    <g transform="translate(20, 50)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="85" height="60" rx="6" fill="#15261F" stroke="#1D4A36" stroke-width="1"/>
      <text x="8" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#FFF">Uni-Shirt (S)</text>
      <text x="8" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" fill="#8EA89D">Stock: 48</text>
      <text x="8" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#E7C64A">₱350.00</text>

      <!-- Item 2 -->
      <rect x="95" y="0" width="85" height="60" rx="6" fill="#15261F" stroke="#1D4A36" stroke-width="1"/>
      <text x="103" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#FFF">Uni-Shirt (M)</text>
      <text x="103" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" fill="#8EA89D">Stock: 112</text>
      <text x="103" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#E7C64A">₱350.00</text>

      <!-- Item 3 -->
      <rect x="190" y="0" width="85" height="60" rx="6" fill="#15261F" stroke="#1D4A36" stroke-width="1"/>
      <text x="198" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#FFF">ID Lanyard</text>
      <text x="198" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" fill="#8EA89D">Stock: 250</text>
      <text x="198" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#E7C64A">₱85.00</text>

      <!-- Item 4 -->
      <rect x="0" y="70" width="85" height="60" rx="6" fill="#15261F" stroke="#1D4A36" stroke-width="1"/>
      <text x="8" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#FFF">CCS Pin</text>
      <text x="8" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" fill="#8EA89D">Stock: 74</text>
      <text x="8" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#E7C64A">₱50.00</text>

      <!-- Item 5 -->
      <rect x="95" y="70" width="85" height="60" rx="6" fill="#15261F" stroke="#1D4A36" stroke-width="1"/>
      <text x="103" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#FFF">Lab Coat (M)</text>
      <text x="103" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" fill="#8EA89D">Stock: 19</text>
      <text x="103" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#E7C64A">₱480.00</text>

      <!-- Item 6 -->
      <rect x="190" y="70" width="85" height="60" rx="6" fill="#15261F" stroke="#1D4A36" stroke-width="1"/>
      <text x="198" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#FFF">USB Drive 32G</text>
      <text x="198" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" fill="#8EA89D">Stock: 35</text>
      <text x="198" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#E7C64A">₱290.00</text>
    </g>

    <!-- Receipt / Cart Panel Right -->
    <g transform="translate(315, 50)">
      <rect x="0" y="0" width="165" height="200" rx="8" fill="#11221B" stroke="#1D4A36" stroke-width="1"/>
      <text x="12" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#F7F5EF">Current Order #1042</text>
      
      <!-- Cart rows -->
      <text x="12" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#E2ECE7">1x Uni-Shirt (M)</text>
      <text x="150" y="45" font-family="monospace" font-size="7" fill="#E7C64A" text-anchor="end">₱350.00</text>

      <text x="12" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#E2ECE7">2x ID Lanyard</text>
      <text x="150" y="65" font-family="monospace" font-size="7" fill="#E7C64A" text-anchor="end">₱170.00</text>

      <line x1="12" y1="90" x2="150" y2="90" stroke="#1D4A36" stroke-width="1"/>

      <text x="12" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#8EA89D">Subtotal</text>
      <text x="150" y="110" font-family="monospace" font-size="7.5" fill="#F7F5EF" text-anchor="end">₱520.00</text>

      <text x="12" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#F7F5EF">TOTAL</text>
      <text x="150" y="130" font-family="monospace" font-size="11" font-weight="700" fill="#E7C64A" text-anchor="end">₱520.00</text>

      <!-- Pay Button -->
      <rect x="12" y="150" width="140" height="35" rx="6" fill="#0B5A3B" stroke="#E7C64A" stroke-width="1"/>
      <text x="82" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFF" text-anchor="middle">COMPLETE SALE ➔</text>
    </g>
  </g>
</svg>
