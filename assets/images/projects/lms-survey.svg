<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLms" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082A1D"/>
      <stop offset="100%" stop-color="#0B4B34"/>
    </linearGradient>
    <linearGradient id="goldLms" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7C64A"/>
      <stop offset="100%" stop-color="#C59F28"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bgLms)"/>

  <!-- Quiz & Evaluation Interface Window -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="480" height="270" rx="12" fill="#0C1712" stroke="url(#goldLms)" stroke-width="1.5"/>
    <rect x="0" y="0" width="480" height="34" rx="12" fill="#073B2A"/>
    <rect x="0" y="22" width="480" height="12" fill="#073B2A"/>
    
    <text x="24" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#E7C64A">EduMetrics • LMS Evaluation &amp; Institutional Survey</text>

    <!-- Progress Indicator -->
    <rect x="340" y="12" width="120" height="10" rx="5" fill="#143527"/>
    <rect x="340" y="12" width="84" height="10" rx="5" fill="#2ECC71"/>

    <!-- Left Column: Survey Card -->
    <g transform="translate(24, 50)">
      <rect x="0" y="0" width="270" height="200" rx="8" fill="#11221B" stroke="#1D4A36" stroke-width="1"/>
      <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#F7F5EF">Faculty Instructional Effectiveness Rating</text>
      <text x="16" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#8EA89D">Course: IT 312 — Web Application Development</text>

      <!-- Rating Radios (Likert Scale) -->
      <g transform="translate(16, 55)">
        <text x="0" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#E2ECE7">1. The instructor explains complex concepts clearly.</text>
        <!-- Stars or Likert circles -->
        <g transform="translate(0, 22)">
          <circle cx="10" cy="8" r="7" fill="#073B2A" stroke="#E7C64A" stroke-width="1.5"/>
          <text x="10" y="11" font-family="sans-serif" font-size="7" fill="#FFF" text-anchor="middle">1</text>
          
          <circle cx="34" cy="8" r="7" fill="#073B2A" stroke="#E7C64A" stroke-width="1.5"/>
          <text x="34" y="11" font-family="sans-serif" font-size="7" fill="#FFF" text-anchor="middle">2</text>

          <circle cx="58" cy="8" r="7" fill="#073B2A" stroke="#E7C64A" stroke-width="1.5"/>
          <text x="58" y="11" font-family="sans-serif" font-size="7" fill="#FFF" text-anchor="middle">3</text>

          <circle cx="82" cy="8" r="7" fill="#073B2A" stroke="#E7C64A" stroke-width="1.5"/>
          <text x="82" y="11" font-family="sans-serif" font-size="7" fill="#FFF" text-anchor="middle">4</text>

          <circle cx="106" cy="8" r="8" fill="#E7C64A" stroke="#E7C64A" stroke-width="1.5"/>
          <text x="106" y="11" font-family="sans-serif" font-size="7" font-weight="700" fill="#073B2A" text-anchor="middle">5</text>
          <text x="130" y="11" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#E7C64A">Strongly Agree</text>
        </g>
      </g>

      <g transform="translate(16, 115)">
        <text x="0" y="12" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#E2ECE7">2. Real-world programming projects are integrated.</text>
        <g transform="translate(0, 22)">
          <circle cx="10" cy="8" r="7" fill="#073B2A" stroke="#E7C64A" stroke-width="1.5"/>
          <circle cx="34" cy="8" r="7" fill="#073B2A" stroke="#E7C64A" stroke-width="1.5"/>
          <circle cx="58" cy="8" r="7" fill="#073B2A" stroke="#E7C64A" stroke-width="1.5"/>
          <circle cx="82" cy="8" r="7" fill="#073B2A" stroke="#E7C64A" stroke-width="1.5"/>
          <circle cx="106" cy="8" r="8" fill="#E7C64A" stroke="#E7C64A" stroke-width="1.5"/>
          <text x="106" y="11" font-family="sans-serif" font-size="7" font-weight="700" fill="#073B2A" text-anchor="middle">5</text>
          <text x="130" y="11" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#E7C64A">Strongly Agree</text>
        </g>
      </g>
    </g>

    <!-- Right Column: Real-time Analytics Radar / Donut -->
    <g transform="translate(306, 50)">
      <rect x="0" y="0" width="150" height="200" rx="8" fill="#11221B" stroke="#1D4A36" stroke-width="1"/>
      <text x="14" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#F7F5EF">Live Aggregation</text>
      
      <!-- Donut Chart -->
      <circle cx="75" cy="80" r="42" fill="none" stroke="#1D4A36" stroke-width="14"/>
      <circle cx="75" cy="80" r="42" fill="none" stroke="#E7C64A" stroke-width="14" stroke-dasharray="190 264" transform="rotate(-90 75 80)"/>
      <circle cx="75" cy="80" r="42" fill="none" stroke="#2ECC71" stroke-width="14" stroke-dasharray="74 264" stroke-dashoffset="-190" transform="rotate(-90 75 80)"/>
      <text x="75" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle">4.89</text>
      <text x="75" y="96" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" fill="#8EA89D" text-anchor="middle">OUT OF 5.0</text>

      <!-- Stat Badges -->
      <g transform="translate(14, 140)">
        <text x="0" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#8EA89D">Student Responses: <tspan fill="#E7C64A" font-weight="700">412 / 420</tspan></text>
        <text x="0" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#8EA89D">Response Rate: <tspan fill="#2ECC71" font-weight="700">98.1%</tspan></text>
        <text x="0" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#8EA89D">Export: CSV, PDF, SUC-Report</text>
      </g>
    </g>
  </g>
</svg>
