<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSys" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082A1E"/>
      <stop offset="100%" stop-color="#0E3D2C"/>
    </linearGradient>
    <linearGradient id="goldSys" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E089"/>
      <stop offset="100%" stop-color="#C59F28"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bgSys)"/>
  
  <!-- Network / Decision Tree Node Graph in Backdrop -->
  <g stroke="#185E43" stroke-width="1.5" stroke-opacity="0.4">
    <line x1="80" y1="80" x2="200" y2="140"/>
    <line x1="200" y1="140" x2="300" y2="90"/>
    <line x1="300" y1="90" x2="420" y2="160"/>
    <line x1="420" y1="160" x2="520" y2="100"/>
    <line x1="200" y1="140" x2="240" y2="280"/>
    <line x1="420" y1="160" x2="480" y2="270"/>
  </g>
  <circle cx="80" cy="80" r="5" fill="#E7C64A"/>
  <circle cx="200" cy="140" r="7" fill="#2ECC71"/>
  <circle cx="300" cy="90" r="6" fill="#E7C64A"/>
  <circle cx="420" cy="160" r="8" fill="#2ECC71"/>
  <circle cx="520" cy="100" r="5" fill="#E7C64A"/>

  <!-- Enterprise Decision Support Dashboard Window -->
  <g transform="translate(60, 45)">
    <!-- Browser chrome -->
    <rect x="0" y="0" width="480" height="270" rx="12" fill="#0D1813" stroke="url(#goldSys)" stroke-width="1.5"/>
    <rect x="0" y="0" width="480" height="32" rx="12" fill="#073B2A"/>
    <rect x="0" y="20" width="480" height="12" fill="#073B2A"/>
    <circle cx="20" cy="16" r="4" fill="#E74C3C"/>
    <circle cx="32" cy="16" r="4" fill="#E7C64A"/>
    <circle cx="44" cy="16" r="4" fill="#2ECC71"/>
    <!-- Search / URL Bar -->
    <rect x="65" y="8" width="220" height="16" rx="4" fill="#0E2E21"/>
    <text x="75" y="20" font-family="monospace" font-size="8" fill="#A4C4B5">adssu.edu.ph/dss-analytics/executive</text>

    <!-- Sidebar -->
    <rect x="0" y="32" width="100" height="238" fill="#0A1611"/>
    <text x="14" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#E7C64A">EXECUTIVE DSS</text>
    
    <rect x="10" y="68" width="80" height="20" rx="4" fill="#143527"/>
    <text x="20" y="81" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#F7F5EF">Overview</text>

    <text x="20" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#7E9A8E">Process Flow</text>
    <text x="20" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#7E9A8E">KPI Analytics</text>
    <text x="20" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#7E9A8E">Resource Plan</text>
    <text x="20" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#7E9A8E">Reports Gen</text>

    <!-- Main Content Area -->
    <!-- KPI Row -->
    <g transform="translate(115, 45)">
      <rect x="0" y="0" width="110" height="48" rx="6" fill="#11221B" stroke="#1D4A36" stroke-width="1"/>
      <text x="10" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#8EA89D">Institutional Throughput</text>
      <text x="10" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#E7C64A">+34.8%</text>

      <rect x="120" y="0" width="110" height="48" rx="6" fill="#11221B" stroke="#1D4A36" stroke-width="1"/>
      <text x="130" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#8EA89D">Workflow Bottlenecks</text>
      <text x="130" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#2ECC71">-61.2%</text>

      <rect x="240" y="0" width="115" height="48" rx="6" fill="#11221B" stroke="#1D4A36" stroke-width="1"/>
      <text x="250" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#8EA89D">Decision Confidence</text>
      <text x="250" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#E7C64A">High (99%)</text>
    </g>

    <!-- Analytics Chart Area -->
    <g transform="translate(115, 105)">
      <!-- Chart Box -->
      <rect x="0" y="0" width="225" height="145" rx="6" fill="#11221B" stroke="#1D4A36" stroke-width="1"/>
      <text x="12" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#F7F5EF">Process Efficiency By College / Unit</text>

      <!-- Bar Chart Elements -->
      <!-- Bar 1 -->
      <rect x="20" y="100" width="18" height="30" rx="3" fill="#0B5A3B"/>
      <text x="22" y="138" font-family="monospace" font-size="7" fill="#7E9A8E">CAS</text>

      <!-- Bar 2 -->
      <rect x="50" y="60" width="18" height="70" rx="3" fill="#E7C64A"/>
      <text x="52" y="138" font-family="monospace" font-size="7" fill="#7E9A8E">CCS</text>

      <!-- Bar 3 -->
      <rect x="80" y="75" width="18" height="55" rx="3" fill="#0B5A3B"/>
      <text x="82" y="138" font-family="monospace" font-size="7" fill="#7E9A8E">CTE</text>

      <!-- Bar 4 -->
      <rect x="110" y="50" width="18" height="80" rx="3" fill="#2ECC71"/>
      <text x="112" y="138" font-family="monospace" font-size="7" fill="#7E9A8E">COE</text>

      <!-- Bar 5 -->
      <rect x="140" y="70" width="18" height="60" rx="3" fill="#0B5A3B"/>
      <text x="142" y="138" font-family="monospace" font-size="7" fill="#7E9A8E">CBA</text>

      <!-- Line Graph Overlay -->
      <path d="M 29 95 L 59 55 L 89 70 L 119 45 L 149 65" stroke="#FFFFFF" stroke-width="2" fill="none"/>
      <circle cx="119" cy="45" r="3" fill="#FFF"/>
    </g>

    <!-- Workflow Status Panel -->
    <g transform="translate(350, 105)">
      <rect x="0" y="0" width="120" height="145" rx="6" fill="#11221B" stroke="#1D4A36" stroke-width="1"/>
      <text x="10" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#F7F5EF">Active Workflows</text>
      
      <circle cx="18" cy="38" r="4" fill="#2ECC71"/>
      <text x="28" y="41" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#E2ECE7">Curriculum Rev</text>

      <circle cx="18" cy="62" r="4" fill="#E7C64A"/>
      <text x="28" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#E2ECE7">Faculty Dev Grant</text>

      <circle cx="18" cy="86" r="4" fill="#2ECC71"/>
      <text x="28" y="89" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#E2ECE7">Procurement Sync</text>

      <circle cx="18" cy="110" r="4" fill="#3498DB"/>
      <text x="28" y="113" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#E2ECE7">Accreditation Data</text>
    </g>
  </g>
</svg>
