<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="avatarGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0E4E35"/>
      <stop offset="60%" stop-color="#073B2A"/>
      <stop offset="100%" stop-color="#042319"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D775"/>
      <stop offset="50%" stop-color="#E7C64A"/>
      <stop offset="100%" stop-color="#A88716"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2A23"/>
      <stop offset="100%" stop-color="#0F1814"/>
    </linearGradient>
    <linearGradient id="lapelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24382F"/>
      <stop offset="100%" stop-color="#141E19"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="250" cy="250" r="235"/>
    </clipPath>
  </defs>

  <!-- Outer Ring with Academic Laurel Gold Border -->
  <circle cx="250" cy="250" r="242" fill="none" stroke="url(#goldRim)" stroke-width="5" stroke-dasharray="12 4"/>
  <circle cx="250" cy="250" r="236" fill="url(#avatarGlow)"/>

  <g clip-path="url(#circleClip)">
    <!-- Tech & Academic Grid Ambient Lines in Background -->
    <path d="M 50 150 L 450 150 M 50 250 L 450 250 M 50 350 L 450 350" stroke="#0E5E41" stroke-width="1" stroke-opacity="0.3"/>
    <path d="M 150 50 L 150 450 M 250 50 L 250 450 M 350 50 L 350 450" stroke="#0E5E41" stroke-width="1" stroke-opacity="0.3"/>
    
    <!-- Code / Academic Glyphs Subtle Backdrop -->
    <text x="70" y="110" font-family="monospace" font-size="14" fill="#E7C64A" fill-opacity="0.35">&lt;Faculty /&gt;</text>
    <text x="350" y="110" font-family="monospace" font-size="14" fill="#E7C64A" fill-opacity="0.35">{ DIT: cand }</text>
    <text x="60" y="390" font-family="monospace" font-size="13" fill="#A8DF8E" fill-opacity="0.25">ADSSU • IT</text>
    <text x="360" y="390" font-family="monospace" font-size="13" fill="#A8DF8E" fill-opacity="0.25">dev::academic</text>

    <!-- Torso / Professional Suit -->
    <path d="M 90 520 C 100 400 160 350 250 350 C 340 350 400 400 410 520 Z" fill="url(#suitGrad)"/>
    
    <!-- White Dress Shirt & Collar -->
    <path d="M 215 350 L 250 430 L 285 350 Z" fill="#F7F5EF"/>
    <path d="M 210 350 L 250 385 L 290 350" stroke="#E2DEC8" stroke-width="2" fill="none"/>
    
    <!-- Formal Academic Emerald & Gold Tie -->
    <path d="M 240 380 L 260 380 L 265 480 L 250 500 L 235 480 Z" fill="#0B5A3B"/>
    <path d="M 244 380 L 256 380 L 258 400 L 242 400 Z" fill="#E7C64A"/>
    <!-- Tie Stripes -->
    <path d="M 238 420 L 262 430" stroke="#E7C64A" stroke-width="3"/>
    <path d="M 236 450 L 264 460" stroke="#E7C64A" stroke-width="3"/>

    <!-- Suit Lapels -->
    <path d="M 170 355 L 230 460 L 210 520 L 120 520 Z" fill="url(#lapelGrad)"/>
    <path d="M 330 355 L 270 460 L 290 520 L 380 520 Z" fill="url(#lapelGrad)"/>
    <!-- Lapel Pin (Golden Torch / Leaf of Academia) -->
    <circle cx="185" cy="405" r="5" fill="#E7C64A"/>
    <polygon points="185,395 188,402 182,402" fill="#F2D775"/>

    <!-- Neck -->
    <rect x="225" y="275" width="50" height="85" rx="10" fill="#D89E78"/>
    <path d="M 225 315 C 240 330 260 330 275 315 Z" fill="#BD815C" opacity="0.4"/>

    <!-- Head / Jawline -->
    <ellipse cx="250" cy="245" rx="72" ry="85" fill="#E4A982"/>

    <!-- Ears -->
    <ellipse cx="178" cy="245" rx="12" ry="20" fill="#D89E78"/>
    <ellipse cx="322" cy="245" rx="12" ry="20" fill="#D89E78"/>

    <!-- Hair (Neat, modern professional side part) -->
    <path d="M 176 230 C 170 160 210 145 250 145 C 310 145 330 180 324 235 C 315 210 300 170 250 170 C 205 170 188 200 176 230 Z" fill="#1C1814"/>
    <path d="M 180 180 C 210 155 270 155 315 175 C 310 160 280 145 240 148 C 200 152 182 170 180 180 Z" fill="#2E2822"/>

    <!-- Eyebrows -->
    <path d="M 205 215 Q 225 210 238 217" stroke="#1C1814" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 262 217 Q 275 210 295 215" stroke="#1C1814" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Eyes (Confident, friendly) -->
    <ellipse cx="222" cy="232" rx="7" ry="5" fill="#1C1814"/>
    <ellipse cx="278" cy="232" rx="7" ry="5" fill="#1C1814"/>
    <circle cx="224" cy="230" r="2" fill="#FFFFFF"/>
    <circle cx="280" cy="230" r="2" fill="#FFFFFF"/>

    <!-- Modern Academic / Tech Eyeglasses -->
    <rect x="202" y="218" width="38" height="28" rx="8" fill="none" stroke="#0B5A3B" stroke-width="3.5"/>
    <rect x="260" y="218" width="38" height="28" rx="8" fill="none" stroke="#0B5A3B" stroke-width="3.5"/>
    <path d="M 240 228 L 260 228" stroke="#E7C64A" stroke-width="3"/>
    <path d="M 185 226 L 202 226" stroke="#0B5A3B" stroke-width="2.5"/>
    <path d="M 298 226 L 315 226" stroke="#0B5A3B" stroke-width="2.5"/>
    <rect x="204" y="220" width="34" height="24" rx="6" fill="#A8DF8E" fill-opacity="0.12"/>
    <rect x="262" y="220" width="34" height="24" rx="6" fill="#A8DF8E" fill-opacity="0.12"/>

    <!-- Nose -->
    <path d="M 247 235 L 244 260 L 253 260" stroke="#BD815C" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Friendly, Dignified Smile -->
    <path d="M 234 282 Q 250 294 266 282" stroke="#A75E3D" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Circular Badge Overlay at Bottom -->
  <g transform="translate(250, 460)">
    <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#073B2A" stroke="url(#goldRim)" stroke-width="2"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#E7C64A" text-anchor="middle" letter-spacing="1.2">ASST. PROFESSOR III</text>
  </g>
</svg>
