<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Antonio Jr. Piloton</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .not-found-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
      background: var(--bg-hero);
      color: var(--color-cream);
    }
    .not-found-card {
      background: rgba(4, 34, 24, 0.7);
      border: 1px solid rgba(231, 198, 74, 0.4);
      border-radius: var(--radius-lg);
      padding: clamp(2rem, 5vw, 3.5rem);
      max-width: 580px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .not-found-code {
      font-family: var(--font-serif);
      font-size: clamp(4rem, 12vw, 7rem);
      font-weight: 800;
      color: var(--color-gold);
      line-height: 1;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="not-found-wrapper">
    <div class="not-found-card">
      <div class="brand-monogram" style="margin: 0 auto 1.5rem auto;">AP</div>
      <div class="not-found-code">404</div>
      <h1 style="font-family: var(--font-serif); font-size: 1.75rem; color: #FFF; margin-bottom: 1rem;">Resource Not Found</h1>
      <p style="font-size: 0.95rem; color: rgba(247, 245, 239, 0.85); line-height: 1.6; margin-bottom: 2rem;">
        The requested page or scholarly artifact could not be located on this portfolio domain. Please verify the URL or return to the main academic profile.
      </p>
      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <a href="index.html" class="btn btn--primary">
          <i class="fas fa-home"></i>
          <span>Return to Homepage</span>
        </a>
        <a href="index.html#contact" class="btn btn--outline-gold">
          <i class="fas fa-envelope"></i>
          <span>Contact Faculty</span>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
